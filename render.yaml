# Render Blueprint for TaskFlow AI -- FREE plan setup (one Docker web service + one free Postgres).
# The root Dockerfile builds the frontend and serves it from the API container, so there is no separate
# static site, and the reminder worker runs inside the API process (free plan has no cron jobs).
# Verify current plan names/limits on render.com/pricing.
# The database is NOT on Render: Render's free Postgres expires after ~30 days. Use a free external
# Postgres (e.g. Neon) and paste its connection string into DATABASE_URL below.
services:
  - type: web
    name: taskflow-api
    runtime: docker
    plan: free # sleeps after ~15 min without traffic
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # postgresql://user:pass@host/db?sslmode=require from Neon (free)
      - key: SECRET_KEY
        generateValue: true
      - key: RUN_WORKER_IN_PROCESS
        value: "1" # reminders/summaries run in a background thread of the API (no paid cron needed)
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto:you@example.com
      - key: ANTHROPIC_API_KEY
        sync: false # optional
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: UPLOAD_DIR
        value: /tmp/uploads # ephemeral on the free plan: attachments vanish on restart/redeploy
      - key: MAX_UPLOAD_MB
        value: "10"
