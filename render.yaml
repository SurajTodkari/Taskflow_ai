# Render Blueprint for TaskFlow AI. Verify current plan names/pricing on render.com/pricing.
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow
    plan: free # free Postgres expires after a limited period; use a paid plan for real use

services:
  - type: web
    name: taskflow-api
    runtime: python
    plan: free # free web services sleep after inactivity
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head # may require a paid plan; otherwise run in Shell / build step
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://taskflow-web.onrender.com
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto:you@example.com
      - key: ANTHROPIC_API_KEY
        sync: false # optional
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: UPLOAD_DIR
        value: /tmp/uploads # ephemeral; use persistent disk (paid) or object storage
      - key: MAX_UPLOAD_MB
        value: "10"

  - type: cron
    name: taskflow-reminders
    runtime: python
    plan: starter # cron jobs are paid-only on Render
    rootDir: backend
    schedule: "* * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: SECRET_KEY
        sync: false # must equal the API's SECRET_KEY
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5-5

  - type: web
    name: taskflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://taskflow-api.onrender.com
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /sw.js
        name: Cache-Control
        value: no-cache
